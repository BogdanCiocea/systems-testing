name: cicd-documentation

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
  run:
    name: 🚀 Run
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🚀 Run
        shell: bash
        run: |
          pip install pytest
          python -m pip install --upgrade pip
          cd laboratories/cicd-documentation
          pytest -v test_iamil.py
